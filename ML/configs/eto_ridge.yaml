# Hiperparámetros Ridge Regression — forecast ETo 7 días
model: ridge
version: "1.0"

params:
  alpha: 1.0
  fit_intercept: true

features:
  - sin_doy    # sin(2π·día_año/365) — estacionalidad
  - cos_doy    # cos(2π·día_año/365)
  - et0_lag1
  - et0_lag2
  - et0_lag3
  - t_max_lag1

target: et0
horizon_days: 7
min_records_required: 60   # fallback a media(14d) si menos de 60 registros
