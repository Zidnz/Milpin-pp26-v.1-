# Hiperparámetros Isolation Forest — detección de anomalías
model: isolation_forest
version: "1.0"

params:
  n_estimators: 100
  contamination: 0.05
  max_samples: "auto"
  random_state: 42

features:
  - et0
  - t_max
  - t_min
  - humedad_relativa
  - viento_2m

promote_gate:
  min_precision_anomaly: 0.70
