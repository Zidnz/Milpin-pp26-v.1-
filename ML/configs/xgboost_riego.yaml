# Hiperparámetros y configuración XGBoost — MILPÍN AgTech v2.0
# Cambios en params/features no requieren PR de código.
# Cambios en task o targets sí requieren reentrenar desde cero.

# ══════════════════════════════════════════════════════════════════
# M1 — Consumo de agua (planeación al INICIO del ciclo)
# ══════════════════════════════════════════════════════════════════
# Pregunta: ¿Cuánta agua necesitará esta parcela esta temporada?
# Inferencia: al inicio del ciclo, con solo información conocida de
# antemano. Sin features realizadas (ver nota de leakage abajo).
#
# Nota de leakage — NO usar como features de M1:
#   et0_promedio_mmdia  → ET₀ real del ciclo completo (fin)
#   lluvia_total_mm     → lluvia real acumulada (fin)
#   etc_total_mm        → ETc real integrada (fin)
#   n_riegos            → es parte de la respuesta
#   deficit_hidrico_frac → outcome del ciclo
#   humedad_suelo_promedio → promedio de lo ocurrido
# Estas columnas están en el CSV para diagnóstico retrospectivo (M3).
# ══════════════════════════════════════════════════════════════════

m1_agua:
  task: regression
  target: volumen_agua_total_m3_ha

  features:
    # Categóricas — conocidas al inicio
    - cultivo
    - tipo_suelo
    - sistema_riego
    - region
    # Características de la parcela — conocidas al inicio
    - area_ha
    - dias_ciclo
    - doy_inicio
    - capacidad_campo
    - punto_marchitez
    - prof_raiz_m
    - salinidad_ec_dsm
    - aporte_capilar_mm
    - percolacion_frac
    - elev_parcela_m
    - año_norm             # captura drift climático inter-anual
    # Clima histórico esperado — estimable al inicio con promedios NASA POWER
    - kc_medio_cultivo     # Kc etapa media (determinístico desde catálogo)
    - et0_hist_mmdia       # ET₀ esperada: sinusoide estacional + sesgo regional
    - lluvia_hist_mm       # lluvia histórica esperada para el período
    - etc_estimada_mm      # et0_hist × kc_medio × dias_ciclo
    - deficit_estimado_mm  # max(0, etc_estimada - lluvia_hist)
    # Features derivadas — calculables al inicio
    - agua_disponible_mm   # (CC - PMP) × prof_raiz × 1000
    - eficiencia_sistema   # lookup por sistema_riego
    - ratio_demanda_suelo  # etc_estimada / agua_disponible

  params:
    n_estimators: 2000
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.80
    colsample_bytree: 0.80
    min_child_weight: 3
    reg_alpha: 0.10
    reg_lambda: 1.00
    early_stopping_rounds: 50
    random_state: 42
    n_jobs: -1

  promote_gate:
    max_mae_m3_ha: 800      # MAE máximo aceptable en m³/ha
    min_r2: 0.82            # R² mínimo en test set


# ══════════════════════════════════════════════════════════════════
# M2 — Rendimiento agrícola (planeación al INICIO del ciclo)
# ══════════════════════════════════════════════════════════════════
# Pregunta: ¿Qué rendimiento esperado tiene esta parcela esta temporada?
# Mismo principio de planeación: solo features conocidas al inicio.
# ══════════════════════════════════════════════════════════════════

m2_rendimiento:
  task: regression
  target: rendimiento_real_ton_ha

  features:
    # Categóricas
    - cultivo
    - tipo_suelo
    - sistema_riego
    - region
    # Parcela
    - area_ha
    - dias_ciclo
    - doy_inicio
    - capacidad_campo
    - punto_marchitez
    - prof_raiz_m
    - salinidad_ec_dsm
    - elev_parcela_m
    - año_norm
    # Clima esperado
    - kc_medio_cultivo
    - et0_hist_mmdia
    - lluvia_hist_mm
    - etc_estimada_mm
    - deficit_estimado_mm
    # Derivadas
    - agua_disponible_mm
    - eficiencia_sistema

  params:
    n_estimators: 2000
    max_depth: 4
    learning_rate: 0.04
    subsample: 0.80
    colsample_bytree: 0.75
    min_child_weight: 5
    reg_alpha: 0.05
    reg_lambda: 1.50
    early_stopping_rounds: 50
    random_state: 42
    n_jobs: -1

  promote_gate:
    max_mae_ton_ha: 0.8     # MAE máximo aceptable en ton/ha
    min_r2: 0.78
