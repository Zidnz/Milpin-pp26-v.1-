# Feature View: parcela_ciclo
# Entidad: parcela_id + ciclo_id
# Fuente: historial_riego JOIN recomendaciones JOIN parcelas
# Frecuencia de materialización: post-riego (trigger o batch diario)

name: parcela_ciclo
entity: [parcela_id, ciclo_id]
source: historial_riego
features:
  - dias_desde_ultimo_riego
  - lamina_acumulada_mm
  - deficit_hidrico_mm
  - et0_acumulada
  - kc_actual
  - etapa_fenologica
  - estres_detectado   # booleano, de anomaly_detector
